[metadata]
name = eqopt
version = 0.2
description = gibbs energy correction for phase diagram
author = wenhao Zhang
author_email = ZHANG.Wenhao@nims.go.jp

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    torch
    pycalphad
    rich
    numpy
    scipy
    sympy
    ase
    pandas
    PyYAML

[options.entry_points]
console_scripts =
    eqopt-calphad = eqopt.cli.calphad:main

[options.packages.find]
where = src
